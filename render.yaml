# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Deploy Full-Stack Quiz Proctor System to Render with 1-Click
# ==============================================================================

services:
  - type: web
    name: quiz-proctor
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FIREBASE_DATABASE_URL
        value: https://quiz-ee5ad-default-rtdb.firebaseio.com/
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: '*'
